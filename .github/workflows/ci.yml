name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Types, lint, tests, build
    runs-on: ubuntu-latest
    # This job runs in well under a minute. A cap turns a hang into a failure
    # that says so, instead of a run that sits there looking busy.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      # The deploy and collection scripts only ever run on the owner's Windows
      # box, so nothing else here would notice a syntax error in them until it
      # failed in front of him. pwsh is preinstalled on the runner.
      - name: Parse the PowerShell scripts
        shell: pwsh
        run: |
          $errors = $null
          foreach ($script in 'update.ps1', 'collect.ps1', 'watch.ps1') {
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script), [ref]$null, [ref]$errors) | Out-Null
            if ($errors) {
              Write-Host "$script :"
              $errors | ForEach-Object { Write-Host "  $_" }
              exit 1
            }
            Write-Host "$script parses"
          }

  image:
    name: Docker image boots and serves
    runs-on: ubuntu-latest
    # Normally about a minute. It has twice sat on "Build image" for twenty and
    # counting with nothing in the diff to explain it, which is the layer cache
    # backend rather than the build - and an unbounded job hides that, holds a
    # runner, and blocks the merge it is meant to gate.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: halls:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Catches what a source build cannot: a missing native module, a file the
      # standalone trace dropped, a broken migration on an empty database.
      - name: Start the container
        run: docker run -d --name halls-ci -p 3000:3000 halls:ci
      - name: Wait for health
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health | tee /tmp/health.json | grep -q '"status":"ok"'; then
              echo "healthy after ${attempt} attempts"
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          echo "container never reported healthy"
          docker logs halls-ci
          exit 1
      # "leagues" counts leagues holding a character, which is 0 on a fresh
      # container; "catalogue" is the seeded league table, which must be there.
      - name: Seeded league catalogue is present
        run: |
          catalogue=$(curl -fsS http://127.0.0.1:3000/api/health | grep -o '"catalogue":[0-9]*' | cut -d: -f2)
          echo "catalogue: ${catalogue}"
          test "${catalogue}" -ge 41
      - name: Every page renders
        run: |
          for path in / /players /players/new; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000${path}")
            echo "${code} ${path}"
            test "${code}" = "200"
          done
      # The ingest endpoint is what collect.ps1 talks to, and it loads the whole
      # export mapper — so this proves that module survived the standalone trace
      # as well. A fresh container has no players, so the account cannot resolve;
      # both failures must be the considered ones, not a stack trace.
      - name: The ingest endpoint answers
        run: |
          test "$(curl -fsS http://127.0.0.1:3000/api/players)" = "[]"
          bad=$(curl -s -o /tmp/bad.json -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -d '{"nope":1}' \
            http://127.0.0.1:3000/api/import/poe)
          cat /tmp/bad.json; echo
          test "${bad}" = "400"
          missing=$(curl -s -o /tmp/missing.json -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -d '{"schema_version":1,"account":"Nobody#0000","characters":[{"name":"x"}]}' \
            http://127.0.0.1:3000/api/import/poe)
          cat /tmp/missing.json; echo
          test "${missing}" = "404"
          grep -q 'Nobody#0000' /tmp/missing.json
      - if: always()
        run: docker rm -f halls-ci
